# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger: none

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '61419ad7-9261-431c-b77e-3c3f871cda99'
  imageRepository: 'voteapp'
  containerRegistry: 'myvotingrepo.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/vote/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
pool:
 name: 'Agent-1'

stages:
- stage: BuildandPushVotingapp
  displayName: BuildandPushVotingapp
  jobs:
  - job: BuildandPushVotingapp
    displayName: BuildandPushVotingapp
    pool:
      name: 'Agent-1'
    steps:
    - task: Docker@2
      displayName: BuildandPushVotingapp
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
